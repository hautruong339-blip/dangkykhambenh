<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Khám Bệnh - BV Ung Bướu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Toàn bộ dùng font Times New Roman */
        body, input, select, textarea, button { 
            font-family: 'Times New Roman', Times, serif !important; 
        }
        body { background-color: #f1f5f9; }
        
        .input-animated { border: 1.5px solid #e2e8f0; transition: all 0.3s; }
        .input-animated:focus { border-color: #2563eb; transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.1); outline: none; }
        
        .option-box { cursor: pointer; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 12px; transition: 0.2s; text-align: center; font-size: 1.1rem; background: white; }
        input[type="radio"]:checked + .option-box { border-color: #2563eb; background: #eff6ff; font-weight: bold; color: #2563eb; }
    </style>
</head>
<body class="py-10 px-4">
    <div class="max-w-2xl mx-auto bg-white rounded-[2.5rem] shadow-2xl border border-gray-100 overflow-hidden">
        <div class="p-8 text-center bg-slate-50 border-b">
            <h1 class="text-3xl font-bold text-slate-900 mb-1 uppercase tracking-tight italic">Đăng Ký Khám Bệnh</h1>
            <p class="text-blue-600 font-bold text-sm italic uppercase tracking-widest">BV Ung Bướu TP.HCM - Cơ Sở 2</p>
        </div>

        <form id="medicalForm" class="px-10 py-8 space-y-6" onsubmit="handleFinalSubmit(event)">
            
            <div>
                <label class="text-base font-bold text-slate-700 uppercase mb-3 block italic">Đã từng khám tại BV Ung Bướu chưa? *</label>
                <div class="grid grid-cols-2 gap-3">
                    <label onclick="toggleMedIdField(true)" class="relative"><input type="radio" name="oldPatient" value="Có" class="absolute opacity-0 w-full h-full cursor-pointer"><div class="option-box">Có</div></label>
                    <label onclick="toggleMedIdField(false)" class="relative"><input type="radio" name="oldPatient" value="Không" checked class="absolute opacity-0 w-full h-full cursor-pointer"><div class="option-box">Không</div></label>
                </div>
            </div>

            <div id="medIdField" class="hidden">
                <label class="text-base font-bold text-blue-600 uppercase mb-2 block tracking-widest italic">Mã y tế (Nếu có)</label>
                <input type="text" id="medicalId" class="input-animated w-full px-4 py-3 rounded-xl outline-none border-blue-100 text-lg" placeholder="Nhập mã số sổ khám bệnh cũ">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="col-span-2 md:col-span-1">
                    <label class="text-base font-bold text-slate-700 uppercase mb-2 block italic">Họ và tên bệnh nhân *</label>
                    <input type="text" id="fullname" required class="input-animated w-full px-4 py-3 rounded-xl outline-none uppercase text-lg" placeholder="NGUYỄN VĂN A">
                </div>
                <div class="col-span-2 md:col-span-1">
                    <label class="text-base font-bold text-slate-700 uppercase mb-2 block italic">Số điện thoại *</label>
                    <input type="text" id="phone" required oninput="this.value = this.value.replace(/[^0-9]/g, '')" class="input-animated w-full px-4 py-3 rounded-xl outline-none text-lg" placeholder="09xxxxxxxx">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-4">
                    <div>
                        <label class="text-base font-bold text-slate-700 uppercase mb-2 block italic">Số CCCD/Định danh *</label>
                        <input type="text" id="cccd" required oninput="this.value = this.value.replace(/[^0-9]/g, '')" class="input-animated w-full px-4 py-3 rounded-xl outline-none text-lg" placeholder="Số căn cước">
                    </div>
                    <div>
                        <label class="text-sm font-bold text-slate-400 uppercase mb-1 block italic underline">Ngày cấp CCCD *</label>
                        <input type="date" id="cccdDate" required class="input-animated w-full px-4 py-2 rounded-lg outline-none text-base">
                    </div>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="text-base font-bold text-slate-700 uppercase mb-2 block italic">Năm sinh *</label>
                        <input type="number" id="yob" required class="input-animated w-full px-4 py-3 rounded-xl outline-none text-lg" placeholder="Ví dụ: 1990">
                    </div>
                    <div>
                        <label class="text-base font-bold text-slate-700 uppercase mb-2 block italic">Giới tính *</label>
                        <select id="gender" required class="input-animated w-full px-4 py-3 rounded-xl outline-none bg-white text-lg">
                            <option value="Nam">Nam</option>
                            <option value="Nữ">Nữ</option>
                        </select>
                    </div>
                </div>
            </div>

            <div>
                <label class="text-base font-bold text-slate-700 uppercase mb-2 block italic">Địa chỉ thường trú (Theo Căn cước công dân) *</label>
                <input type="text" id="address" required class="input-animated w-full px-4 py-3 rounded-xl outline-none text-lg" placeholder="Xã/Phường, Quận/Huyện, Tỉnh/Thành">
            </div>

            <div>
                <label class="text-base font-bold text-red-500 uppercase mb-2 block italic">Lý do khám / Triệu chứng *</label>
                <textarea id="symptoms" required rows="3" class="input-animated w-full px-4 py-3 rounded-xl outline-none text-lg" placeholder="Mô tả cụ thể triệu chứng hiện tại..."></textarea>
            </div>

            <div>
                <label class="text-base font-bold text-blue-600 uppercase mb-2 block tracking-wider italic">Ngày & Giờ dự kiến khám *</label>
                <input type="datetime-local" id="visitTime" required class="input-animated w-full px-4 py-3 rounded-xl outline-none text-lg">
            </div>

            <div class="space-y-6 border-t pt-6 border-dashed border-gray-200">
                <div>
                    <label class="text-base font-bold text-slate-700 uppercase mb-3 block italic">Sử dụng BHYT? *</label>
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <label onclick="renderServices(true)" class="relative"><input type="radio" name="isBHYT" value="Có" class="absolute opacity-0 w-full h-full cursor-pointer"><div class="option-box">Có BHYT</div></label>
                        <label onclick="renderServices(false)" class="relative"><input type="radio" name="isBHYT" value="Không" checked class="absolute opacity-0 w-full h-full cursor-pointer"><div class="option-box">Không (Viện phí)</div></label>
                    </div>
                    <div id="service_options_container" class="grid grid-cols-1 gap-2">
                        </div>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-bold uppercase tracking-widest hover:bg-slate-800 transition shadow-xl active:scale-95 text-xl italic">
                Xác nhận gửi hồ sơ
            </button>
        </form>
    </div>

    <script>
        const conf = { databaseURL: "https://tbkxnub-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        firebase.initializeApp(conf);
        const db = firebase.database();

        function toggleMedIdField(isOld) {
            document.getElementById('medIdField').classList.toggle('hidden', !isOld);
        }

        function renderServices(isBHYT) {
            const container = document.getElementById('service_options_container');
            container.innerHTML = "";
            const services = isBHYT ? [
                "BHYT tế trong giờ (7h30-12h, 13h-16h30)",
                "BHYT DV (7h30-12h, 13h-16h30)",
                "BHYT ngoài giờ (5h-7h30)"
            ] : [
                "Viện phí (VP)",
                "DV trong giờ (7h30-12h, 13h-16h30)",
                "DV ngoài giờ (5h-7h30)"
            ];

            services.forEach(s => {
                container.innerHTML += `
                    <label class="relative">
                        <input type="radio" name="serviceDetail" value="${s}" required class="absolute opacity-0">
                        <div class="option-box text-left text-base italic">${s}</div>
                    </label>
                `;
            });
        }

        renderServices(false);

        function handleFinalSubmit(e) {
            e.preventDefault();
            const serviceDetail = document.querySelector('input[name="serviceDetail"]:checked');
            if(!serviceDetail) return alert("Vui lòng chọn khung giờ khám!");

            const data = {
                name: document.getElementById('fullname').value.toUpperCase(),
                phone: document.getElementById('phone').value,
                cccd: document.getElementById('cccd').value,
                cccdDate: document.getElementById('cccdDate').value,
                yob: document.getElementById('yob').value,
                gender: document.getElementById('gender').value,
                address: document.getElementById('address').value,
                symptoms: document.getElementById('symptoms').value,
                oldPatient: document.querySelector('input[name="oldPatient"]:checked').value,
                medicalId: document.getElementById('medicalId').value || "N/A",
                visitTime: document.getElementById('visitTime').value,
                isBHYT: document.querySelector('input[name="isBHYT"]:checked').value,
                serviceDetail: serviceDetail.value,
                status: 'Chờ xử lý',
                time: new Date().toLocaleString('vi-VN'),
                timestamp: Date.now()
            };

            db.ref('patients').push(data).then(() => {
                alert('Đăng ký thành công!');
                window.location.reload();
            });
        }
    </script>
</body>
</html>
