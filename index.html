<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Đăng Ký Khám Bệnh - BV Ung Bướu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { 
            font-family: 'Times New Roman', Times, serif !important; 
            background-image: url('N%E1%BB%90N.jpg'); 
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }

        .glass-overlay {
            background: rgba(241, 245, 249, 0.6);
            backdrop-filter: blur(6px);
            min-height: 100vh;
            padding: 20px 12px;
        }

        .neumorphic-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        /* Group các input để chống nhảy hàng trên iPhone */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-control {
            width: 100%;
            height: 50px; /* Chiều cao chuẩn cho Mobile */
            padding: 0 16px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            display: block;
            -webkit-appearance: none; /* Reset Safari */
        }

        /* Fix riêng cho date/datetime trên iPhone không bị dẹt/trắng */
        input[type="date"], input[type="datetime-local"] {
            min-height: 50px;
            line-height: 50px;
            position: relative;
        }

        /* Tạo chữ hướng dẫn mờ cho iPhone khi chưa có dữ liệu */
        input[type="date"]:invalid:before,
        input[type="datetime-local"]:invalid:before {
            content: attr(data-placeholder);
            color: #94a3b8;
            position: absolute;
            left: 16px;
        }

        .input-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .option-box {
            cursor: pointer;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px;
            background: white;
            transition: 0.2s;
            text-align: center;
            font-size: 14px;
        }

        input[type="radio"]:checked + .option-box {
            border-color: #2563eb;
            background: #eff6ff;
            color: #2563eb;
            font-weight: bold;
        }

        .btn-submit {
            background: linear-gradient(135deg, #1e293b, #334155);
            height: 56px;
            border-radius: 16px;
            color: white;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="glass-overlay">
        <div class="max-w-xl mx-auto neumorphic-card overflow-hidden">
            <div class="p-5 text-center bg-white/50 border-b border-gray-100">
                <h1 class="text-xl font-black text-blue-900 uppercase italic">Đăng Ký Khám Bệnh</h1>
                <p class="text-emerald-600 font-bold text-[10px] italic uppercase tracking-widest mt-1">BV Ung Bướu TP.HCM - Cơ Sở 2</p>
            </div>

            <form id="medicalForm" class="p-5 space-y-5" onsubmit="handleFinalSubmit(event)">
                
                <div class="input-group">
                    <label class="text-xs font-bold text-slate-700 uppercase italic ml-1">Bạn đã từng khám chưa? *</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label onclick="document.getElementById('medIdField').classList.remove('hidden')" class="relative">
                            <input type="radio" name="oldPatient" value="Có" class="absolute opacity-0 w-full h-full">
                            <div class="option-box">Đã từng khám</div>
                        </label>
                        <label onclick="document.getElementById('medIdField').classList.add('hidden')" class="relative">
                            <input type="radio" name="oldPatient" value="Không" checked class="absolute opacity-0 w-full h-full">
                            <div class="option-box">Khám lần đầu</div>
                        </label>
                    </div>
                </div>

                <div id="medIdField" class="hidden">
                    <input type="text" id="medicalId" class="input-control" placeholder="Nhập mã y tế cũ">
                </div>

                <div class="grid grid-cols-1 gap-4">
                    <div class="input-group">
                        <label class="text-xs font-bold text-slate-600 uppercase italic ml-1">Họ và tên *</label>
                        <input type="text" id="fullname" required class="input-control font-bold text-blue-900 uppercase" placeholder="NGUYỄN VĂN A">
                    </div>
                    <div class="input-group">
                        <label class="text-xs font-bold text-slate-600 uppercase italic ml-1">Số điện thoại *</label>
                        <input type="text" id="phone" required oninput="this.value = this.value.replace(/[^0-9]/g, '')" class="input-control font-bold" placeholder="09xxxxxxxx">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="input-group">
                        <label class="text-xs font-bold text-slate-600 uppercase italic ml-1">Số CCCD & Ngày cấp *</label>
                        <input type="text" id="cccd" required oninput="this.value = this.value.replace(/[^0-9]/g, '')" class="input-control font-bold mb-2" placeholder="Nhập 12 số CCCD">
                        <input type="date" id="cccdDate" required data-placeholder="Chọn ngày cấp CCCD" class="input-control">
                    </div>
                    <div class="input-group">
                        <label class="text-xs font-bold text-slate-600 uppercase italic ml-1">Năm sinh & Giới tính *</label>
                        <input type="number" id="yob" required class="input-control font-bold mb-2" placeholder="Năm sinh: 1990">
                        <select id="gender" required class="input-control font-bold text-blue-600">
                            <option value="Nam">Nam</option>
                            <option value="Nữ">Nữ</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label class="text-xs font-bold text-slate-600 uppercase italic ml-1">Địa chỉ thường trú *</label>
                    <input type="text" id="address" required class="input-control" placeholder="Số nhà, Phường, Quận, Tỉnh/TP">
                </div>

                <div class="input-group">
                    <label class="text-xs font-bold text-red-600 uppercase italic ml-1">Lý do khám / Triệu chứng *</label>
                    <textarea id="symptoms" required rows="2" class="input-control !h-auto py-3 italic" placeholder="Mô tả sơ lược triệu chứng..."></textarea>
                </div>

                <div class="bg-blue-50/70 p-4 rounded-xl border border-blue-100">
                    <label class="text-sm font-bold text-blue-800 uppercase italic mb-2 block">Ngày & Giờ muốn đến khám *</label>
                    <input type="datetime-local" id="visitTime" required data-placeholder="Bấm chọn lịch khám bệnh" class="input-control font-bold text-blue-900 !border-blue-200">
                </div>

                <div class="input-group">
                    <label class="text-sm font-bold text-slate-700 uppercase italic mb-2 block">Có sử dụng BHYT? *</label>
                    <div class="grid grid-cols-2 gap-3 mb-2">
                        <label onclick="renderServices(true)" class="relative">
                            <input type="radio" name="isBHYT" value="Có" class="absolute opacity-0 w-full h-full">
                            <div class="option-box">CÓ</div>
                        </label>
                        <label onclick="renderServices(false)" class="relative">
                            <input type="radio" name="isBHYT" value="Không" checked class="absolute opacity-0 w-full h-full">
                            <div class="option-box">KHÔNG</div>
                        </label>
                    </div>
                    <div id="service_options_container" class="space-y-2"></div>
                </div>

                <div class="pt-2">
                    <button type="submit" id="submitBtn" class="btn-submit w-full">Gửi hồ sơ đăng ký</button>
                    <p class="text-center text-[9px] text-slate-400 mt-3 font-bold uppercase italic">Vui lòng kiểm tra kỹ thông tin trước khi gửi</p>
                </div>
            </form>
        </div>
    </div>

    <script>
        const conf = { databaseURL: "https://tbkxnub-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        firebase.initializeApp(conf);
        const db = firebase.database();

        function renderServices(isBHYT) {
            const container = document.getElementById('service_options_container');
            container.innerHTML = "";
            const services = isBHYT ? ["BHYT trong giờ (7h30-16h30)", "BHYT Dịch vụ (7h30-16h30)", "BHYT ngoài giờ (5h-7h30)"] : ["Viện phí trong giờ (7h30-16h30)", "Dịch vụ trong giờ (7h30-16h30)", "Dịch vụ ngoài giờ (5h-7h30)"];
            services.forEach(s => {
                container.innerHTML += `<label class="relative block"><input type="radio" name="serviceDetail" value="${s}" required class="absolute opacity-0"><div class="option-box text-left text-xs italic px-4 py-3">${s}</div></label>`;
            });
        }
        renderServices(false);

        async function handleFinalSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.innerHTML = "ĐANG LƯU HỒ SƠ...";
            try {
                const data = {
                    name: document.getElementById('fullname').value.toUpperCase(),
                    phone: document.getElementById('phone').value,
                    cccd: document.getElementById('cccd').value,
                    cccdDate: document.getElementById('cccdDate').value,
                    address: document.getElementById('address').value,
                    yob: document.getElementById('yob').value,
                    gender: document.getElementById('gender').value,
                    symptoms: document.getElementById('symptoms').value,
                    visitTime: document.getElementById('visitTime').value,
                    oldPatient: document.querySelector('input[name="oldPatient"]:checked').value,
                    medicalId: document.getElementById('medicalId').value || "N/A",
                    serviceDetail: document.querySelector('input[name="serviceDetail"]:checked').value,
                    isBHYT: document.querySelector('input[name="isBHYT"]:checked').value,
                    status: 'Chờ xử lý',
                    time: new Date().toLocaleString('vi-VN'),
                    timestamp: Date.now()
                };
                await db.ref('patients').push(data);
                alert('Đăng ký thành công!'); window.location.reload();
            } catch (err) { alert("Lỗi kết nối mạng!"); btn.disabled = false; btn.innerHTML = "Gửi hồ sơ đăng ký"; }
        }
    </script>
</body>
</html>
