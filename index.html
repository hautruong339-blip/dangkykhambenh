<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Đăng Ký Khám Bệnh - BV Ung Bướu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { 
            font-family: 'Times New Roman', Times, serif !important; 
            background-image: url('N%E1%BB%90N.jpg'); 
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }

        .glass-overlay {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(20px);
            min-height: 100vh;
            padding: 20px 10px;
        }

        .card-super-3d {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 35px;
            box-shadow: 0 40px 80px -15px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* --- FLOATING LABEL POP-OUT --- */
        .input-wrapper {
            position: relative;
            margin-bottom: 28px;
        }

        .input-tech {
            width: 100%;
            height: 56px;
            padding: 0 18px;
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 16px;
            outline: none;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 5;
            position: relative;
        }

        .label-tech {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 15px;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            font-style: italic;
            z-index: 10;
        }

        .input-tech:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
            transform: scale(1.02);
        }

        .input-tech:focus ~ .label-tech,
        .input-tech:not(:placeholder-shown) ~ .label-tech {
            top: -10px;
            left: 15px;
            font-size: 12px;
            font-weight: 900;
            color: #ffffff;
            background: #1d4ed8;
            padding: 2px 10px;
            border-radius: 10px;
            font-style: normal;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(29, 78, 216, 0.3);
        }

        /* --- OPTION BOXES FIX --- */
        .opt-box {
            cursor: pointer;
            border: 2px solid #f1f5f9;
            border-radius: 18px;
            background: white;
            transition: 0.3s;
            text-align: center;
            font-weight: 800;
            padding: 12px 8px;
            font-size: 0.85rem;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.05);
        }

        /* Ô Dịch vụ chuyên dụng (Fix xuống hàng) */
        .service-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 14px;
            width: 100%;
            font-size: 0.95rem;
            white-space: nowrap; /* Chống gãy dòng */
        }

        .service-time {
            font-size: 0.75rem;
            font-weight: 600;
            opacity: 0.7;
            margin-left: 8px;
        }

        input[type="radio"]:checked + .opt-box {
            border-color: #3b82f6;
            background: #eff6ff;
            color: #1d4ed8;
            box-shadow: inset 0 0 10px rgba(59, 130, 246, 0.1);
            transform: translateY(-2px);
        }

        .btn-neon {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            height: 64px;
            border-radius: 20px;
            color: white;
            font-weight: 900;
            text-transform: uppercase;
            font-style: italic;
            box-shadow: 0 15px 35px rgba(59, 130, 246, 0.4);
            transition: 0.4s;
            font-size: 1.25rem;
        }
        .btn-neon:active { transform: scale(0.96); }
    </style>
</head>
<body>
    <div class="glass-overlay">
        <div class="max-w-xl mx-auto card-super-3d overflow-hidden">
            <div class="p-6 text-center border-b border-gray-100">
                <h1 class="text-[23px] font-black text-blue-900 uppercase italic tracking-tighter whitespace-nowrap">Đăng Ký Khám Bệnh</h1>
                <p class="text-emerald-600 font-bold text-[9px] italic uppercase tracking-[0.3em] mt-1">CƠ SỞ 2 - BV UNG BƯỚU TP.HCM</p>
                <div class="h-1.5 w-16 bg-blue-600 mx-auto mt-4 rounded-full shadow-lg"></div>
            </div>

            <form id="medicalForm" class="p-6 md:p-10 space-y-8" onsubmit="handleFinalSubmit(event)">
                
                <div class="space-y-4">
                    <label class="text-xs font-black text-slate-700 uppercase italic ml-1">Tiền sử khám bệnh *</label>
                    <div class="grid grid-cols-2 gap-4">
                        <label onclick="document.getElementById('medIdField').classList.remove('hidden')" class="relative">
                            <input type="radio" name="oldPatient" value="Có" class="absolute opacity-0 w-full h-full">
                            <div class="opt-box">ĐÃ TỪNG</div>
                        </label>
                        <label onclick="document.getElementById('medIdField').classList.add('hidden')" class="relative">
                            <input type="radio" name="oldPatient" value="Không" checked class="absolute opacity-0 w-full h-full">
                            <div class="opt-box">LẦN ĐẦU</div>
                        </label>
                    </div>
                </div>

                <div id="medIdField" class="hidden input-wrapper">
                    <input type="text" id="medicalId" class="input-tech font-bold" placeholder=" ">
                    <label class="label-tech">MÃ Y TẾ (SỐ TRÊN SỔ CŨ)</label>
                </div>

                <div class="input-wrapper">
                    <input type="text" id="fullname" required class="input-tech font-black text-blue-900 uppercase" placeholder=" " oninput="this.value = this.value.toUpperCase()">
                    <label class="label-tech">Họ và tên bệnh nhân *</label>
                </div>

                <div class="input-wrapper">
                    <input type="text" id="phone" required oninput="this.value = this.value.replace(/[^0-9]/g, '')" class="input-tech font-bold" placeholder=" ">
                    <label class="label-tech">Số điện thoại liên lạc *</label>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="input-wrapper">
                        <input type="text" id="cccd" required oninput="this.value = this.value.replace(/[^0-9]/g, '')" class="input-tech font-bold" placeholder=" ">
                        <label class="label-tech">Số CCCD (12 số) *</label>
                    </div>
                    <div class="input-wrapper">
                        <input type="date" id="cccdDate" required class="input-tech font-bold" placeholder=" ">
                        <label class="label-tech">Ngày cấp CCCD *</label>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="input-wrapper">
                        <input type="number" id="yob" required class="input-tech font-bold" placeholder=" ">
                        <label class="label-tech">Năm sinh *</label>
                    </div>
                    <div class="input-wrapper">
                        <select id="gender" required class="input-tech font-bold text-blue-600 bg-white" placeholder=" ">
                            <option value="" disabled selected hidden></option>
                            <option value="Nam">Nam</option>
                            <option value="Nữ">Nữ</option>
                        </select>
                        <label class="label-tech">Giới tính *</label>
                    </div>
                </div>

                <div class="input-wrapper">
                    <input type="text" id="address" required class="input-tech" placeholder=" ">
                    <label class="label-tech">Địa chỉ thg trú (Theo căn cước) *</label>
                </div>

                <div class="input-wrapper">
                    <textarea id="symptoms" required rows="2" class="input-tech !h-auto py-4 italic" placeholder=" "></textarea>
                    <label class="label-tech text-red-600">Lý do khám bệnh *</label>
                </div>

                <div class="input-wrapper">
                    <input type="datetime-local" id="visitTime" required class="input-tech font-black text-blue-900" placeholder=" ">
                    <label class="label-tech">Ngày & Giờ muốn đến khám *</label>
                </div>

                <div class="space-y-4">
                    <label class="text-xs font-black text-slate-700 uppercase italic ml-1">Sử dụng bảo hiểm y tế? *</label>
                    <div class="grid grid-cols-2 gap-4">
                        <label onclick="renderServices(true)" class="relative">
                            <input type="radio" name="isBHYT" value="Có" class="absolute opacity-0 w-full h-full">
                            <div class="opt-box uppercase">CÓ BHYT</div>
                        </label>
                        <label onclick="renderServices(false)" class="relative">
                            <input type="radio" name="isBHYT" value="Không" checked class="absolute opacity-0 w-full h-full">
                            <div class="opt-box uppercase">KHÔNG BHYT</div>
                        </label>
                    </div>
                    <div id="service_options_container" class="space-y-4 pt-4"></div>
                </div>

                <div class="pt-6">
                    <button type="submit" id="submitBtn" class="btn-neon w-full">XÁC NHẬN GỬI HỒ SƠ</button>
                    <p class="text-center text-[10px] text-slate-400 mt-6 font-black uppercase italic tracking-widest">Bệnh viện ung bướu TP.HCM</p>
                </div>
            </form>
        </div>
    </div>

    <script>
        const conf = { databaseURL: "https://tbkxnub-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        firebase.initializeApp(conf);
        const db = firebase.database();

        function renderServices(isBHYT) {
            const container = document.getElementById('service_options_container');
            container.innerHTML = "";
            const services = isBHYT ? [
                {n: "BHYT TRONG GIỜ", t: "7H30-16H30"},
                {n: "BHYT DỊCH VỤ", t: "7H30-16H30"},
                {n: "BHYT NGOÀI GIỜ", t: "5H-7H30"}
            ] : [
                {n: "VIỆN PHÍ TRONG GIỜ", t: "7H30-16H30"},
                {n: "DỊCH VỤ TRONG GIỜ", t: "7H30-16H30"},
                {n: "DỊCH VỤ NGOÀI GIỜ", t: "5H-7H30"}
            ];
            services.forEach(s => {
                container.innerHTML += `
                    <label class="relative block transform transition active:scale-[0.97]">
                        <input type="radio" name="serviceDetail" value="${s.n} (${s.t})" required class="absolute opacity-0">
                        <div class="opt-box service-box italic">
                            <span>${s.n}</span>
                            <span class="service-time">${s.t}</span>
                        </div>
                    </label>`;
            });
        }
        renderServices(false);

        async function handleFinalSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.innerHTML = "ĐANG LƯU...";
            try {
                const data = {
                    name: document.getElementById('fullname').value.toUpperCase(),
                    phone: document.getElementById('phone').value,
                    cccd: document.getElementById('cccd').value,
                    cccdDate: document.getElementById('cccdDate').value,
                    address: document.getElementById('address').value,
                    yob: document.getElementById('yob').value,
                    gender: document.getElementById('gender').value,
                    symptoms: document.getElementById('symptoms').value,
                    visitTime: document.getElementById('visitTime').value,
                    oldPatient: document.querySelector('input[name="oldPatient"]:checked').value,
                    medicalId: document.getElementById('medicalId').value || "N/A",
                    serviceDetail: document.querySelector('input[name="serviceDetail"]:checked').value,
                    isBHYT: document.querySelector('input[name="isBHYT"]:checked').value,
                    status: 'Chờ xử lý',
                    time: new Date().toLocaleString('vi-VN'),
                    timestamp: Date.now()
                };
                await db.ref('patients').push(data);
                alert('Đăng ký thành công!'); window.location.reload();
            } catch (err) { alert("Lỗi mạng!"); btn.disabled = false; btn.innerHTML = "XÁC NHẬN GỬI HỒ SƠ"; }
        }
    </script>
</body>
</html>
